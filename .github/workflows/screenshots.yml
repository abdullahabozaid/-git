name: Screenshots

# Renders every screen in the iOS Simulator using demo mode (-demo <scene>) and commits
# the PNGs to docs/screenshots/ so the UI can be reviewed without a Mac.
# Runs on pushes whose commit message contains [screenshots].
on:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shots:
    if: contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild build -project Tawfeeq.xcodeproj -scheme Tawfeeq -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            -quiet 2>&1 | tail -50

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for r, l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          pro = [x for x in phones if 'Pro' in x['name'] and 'Max' not in x['name']]
          print((pro or phones)[-1]['udid'])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Tawfeeq.app

      - name: Capture screens
        run: |
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          shoot() {
            xcrun simctl launch --terminate-running-process "$UDID" uk.tawfeeq.app -demo "$2" > /dev/null
            sleep 6
            xcrun simctl io "$UDID" screenshot "docs/screenshots/$1.png" > /dev/null
            sips -Z 1100 "docs/screenshots/$1.png" > /dev/null
            echo "captured $1"
          }
          xcrun simctl ui "$UDID" appearance light
          for s in idle empty focusing pass passSheet night morning summary insights rules settings \
                   onboarding0 onboarding1 onboarding2 onboarding3 onboarding4 onboarding5 onboarding6; do
            shoot "light-$s" "$s"
          done
          xcrun simctl ui "$UDID" appearance dark
          for s in idle focusing pass night insights settings; do
            shoot "dark-$s" "$s"
          done
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          shoot "large-focusing" focusing
          shoot "large-insights" insights
          ls -la docs/screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
