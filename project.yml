# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# The .xcodeproj is git-ignored; this file is the source of truth.
name: Tawfeeq
options:
  bundleIdPrefix: uk.tawfeeq
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Tawfeeq:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.tawfeeq.app
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TAWFEEQ_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tawfeeq
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NFCReaderUsageDescription: Tawfeeq reads your desk tag to start and end focus sessions.
        NSAlarmKitUsageDescription: Tawfeeq rings your wake alarm, which you turn off by tapping your desk tag.
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        # Only needed so ISO 7816 cards don't break the scan sheet; we only use NTAG (MIFARE Ultralight family).
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - D2760000850101
    entitlements:
      path: App/Tawfeeq.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.nfc.readersession.formats:
          - TAG
        com.apple.security.application-groups:
          - group.uk.tawfeeq
        com.apple.developer.associated-domains:
          - applinks:tawfeeq.uk
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: DeviceActivityMonitor
      - target: ActivityReport
      - target: Widgets

  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.tawfeeq.app.ShieldConfiguration
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Tawfeeq Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.uk.tawfeeq

  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.tawfeeq.app.ShieldAction
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Tawfeeq Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.uk.tawfeeq

  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.tawfeeq.app.DeviceActivityMonitor
    info:
      path: Extensions/DeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Tawfeeq Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/DeviceActivityMonitor/DeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.uk.tawfeeq

  ActivityReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Extensions/ActivityReport
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.tawfeeq.app.ActivityReport
    info:
      path: Extensions/ActivityReport/Info.plist
      properties:
        CFBundleDisplayName: Tawfeeq Report
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Extensions/ActivityReport/ActivityReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.uk.tawfeeq

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widgets
      - path: Shared
      - path: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.tawfeeq.app.Widgets
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tawfeeq Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.tawfeeq
